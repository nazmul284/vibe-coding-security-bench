<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NoteShare</title>
<style>
:root{--ink:#182326;--muted:#718083;--paper:#fbfaf6;--cream:#f3efe5;--teal:#0f766e;--teal-dark:#095c56;--line:#deddd5;--coral:#d86c52}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.shell{max-width:1120px;margin:auto;padding:28px 28px 64px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:-.02em}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--teal);color:#fff;font-weight:900}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:64px}.pill{background:var(--cream);padding:9px 15px;border-radius:999px;color:var(--muted);font-size:13px}.hero{max-width:710px;margin-bottom:38px}.eyebrow{color:var(--teal);font-weight:750;letter-spacing:.12em;text-transform:uppercase;font-size:12px}.hero h1{font:700 clamp(40px,6vw,72px)/.98 Georgia,serif;letter-spacing:-.05em;margin:16px 0 20px}.hero p{color:var(--muted);font-size:18px;max-width:560px}.layout{display:grid;grid-template-columns:320px 1fr;gap:22px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 10px 30px #273b3510}.tabs{display:flex;background:var(--cream);padding:4px;border-radius:12px;margin-bottom:19px}.tabs button{background:transparent;padding:9px 12px;flex:1;color:var(--muted);border-radius:9px}.tabs button.active{background:#fff;color:var(--ink);box-shadow:0 2px 9px #273b3510;font-weight:700}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:6px;color:var(--muted)}input,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;color:var(--ink);outline:none}input:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #0f766e18}textarea{resize:vertical;min-height:190px}.primary{width:100%;background:var(--teal);color:#fff;padding:12px 16px;border-radius:10px;font-weight:750;margin-top:8px}.primary:hover{background:var(--teal-dark)}.link{background:none;color:var(--teal);font-weight:700}.notice{font-size:13px;color:var(--coral);min-height:20px;margin-top:11px}.app{display:none}.app.show{display:block}.empty{text-align:center;padding:70px 20px;color:var(--muted)}.notes-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.notes-head h2{margin:0;font:700 27px Georgia,serif}.small{font-size:13px;color:var(--muted)}.note-list{display:grid;gap:10px}.note-item{padding:15px 16px;border:1px solid var(--line);border-radius:13px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.note-item:hover,.note-item.selected{border-color:var(--teal);background:#f4fbf9}.note-item strong{display:block}.note-item span{font-size:12px;color:var(--muted)}.editor{display:none}.editor.show{display:block}.editor-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px}.ghost{background:var(--cream);padding:9px 12px;border-radius:9px;color:var(--ink)}.danger{color:#b64938;background:#fff1ed}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.actions .primary{width:auto}.shared{max-width:760px;margin:80px auto}.shared h1{font:700 48px/1.05 Georgia,serif}.shared .body{white-space:pre-wrap;font-size:18px;line-height:1.8;margin-top:35px}.back{color:var(--teal);font-weight:700;text-decoration:none}@media(max-width:760px){.shell{padding:20px}.top{margin-bottom:45px}.layout{grid-template-columns:1fr}.hero h1{font-size:48px}.editor{order:-1}}
</style></head><body><main class="shell"><div class="top"><div class="brand"><div class="mark">N</div>NoteShare</div><div id="status" class="pill">Your private notebook</div></div>
<section id="auth"><div class="hero"><div class="eyebrow">A quieter place for ideas</div><h1>Keep your thoughts close.</h1><p>Write, save, and share the notes that matter. Your notebook is private until you choose otherwise.</p></div><div class="card" style="max-width:420px"><div class="tabs"><button id="loginTab" class="active">Log in</button><button id="signupTab">Sign up</button></div><form id="authForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password <span id="passwordHint"></span></label><input id="password" type="password" required autocomplete="current-password" placeholder="At least 6 characters"></div><button class="primary" id="authButton">Log in</button><div class="notice" id="authNotice"></div></form></div></section>
<section id="app" class="app"><div class="layout"><div class="card"><div class="notes-head"><h2>My notes</h2><button class="link" id="newButton">+ New</button></div><div id="noteList" class="note-list"></div></div><div class="card editor" id="editor"><div class="editor-top"><span class="small" id="editorLabel">New note</span><button class="ghost danger" id="deleteButton">Delete</button></div><div class="field"><label>Title</label><input id="title" placeholder="A thought worth keeping"></div><div class="field"><label>Body</label><textarea id="body" placeholder="Start writing..."></textarea></div><div class="actions"><button class="ghost" id="shareButton">Create share link</button><button class="primary" id="saveButton">Save note</button></div><div class="notice" id="editorNotice"></div></div></div></section></main><script>
const $=id=>document.getElementById(id);let token=localStorage.getItem('noteshare_token'),notes=[],selected=null,signup=false;
async function api(path,opts={}){opts.headers={...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(path,opts);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Something went wrong');return d}
async function showShared(){try{const n=await api(location.pathname);document.querySelector('main').innerHTML=`<div class="shared"><a class="back" href="/">← NoteShare</a><div class="eyebrow" style="margin-top:48px">A shared note</div><h1>${esc(n.title)}</h1><div class="small">Updated ${new Date(n.updated_at).toLocaleDateString()}</div><div class="body">${esc(n.body)}</div></div>`}catch(e){document.querySelector('main').innerHTML=`<div class="shared"><a class="back" href="/">← NoteShare</a><h1>Note unavailable</h1><p class="small">${esc(e.message)}</p></div>`}}
function setAuthMode(v){signup=v;$('loginTab').classList.toggle('active',!v);$('signupTab').classList.toggle('active',v);$('authButton').textContent=v?'Create account':'Log in';$('passwordHint').textContent=v?'(6+ characters)':'';$('password').autocomplete=v?'new-password':'current-password';$('authNotice').textContent=''}
$('loginTab').onclick=()=>setAuthMode(false);$('signupTab').onclick=()=>setAuthMode(true);
$('authForm').onsubmit=async e=>{e.preventDefault();$('authNotice').textContent='';try{let email=$('email').value,password=$('password').value;if(signup){await api('/api/signup',{method:'POST',body:JSON.stringify({email,password})})}let d=await api('/api/login',{method:'POST',body:JSON.stringify({email,password})});token=d.token;localStorage.setItem('noteshare_token',token);showApp()}catch(e){$('authNotice').textContent=e.message}}
async function showApp(){ $('auth').style.display='none';$('app').classList.add('show');$('status').textContent='Private notebook';await loadNotes() }
async function loadNotes(){try{notes=await api('/api/notes');renderNotes();if(!selected&&notes[0])openNote(notes[0]);else if(!notes.length)newNote()}catch(e){logout()}}
function renderNotes(){let el=$('noteList');el.innerHTML=notes.length?notes.map(n=>`<div class="note-item ${selected?.id===n.id?'selected':''}" data-id="${n.id}"><div><strong>${esc(n.title)}</strong><span>${new Date(n.updated_at).toLocaleDateString()}${n.shared?' · shared':''}</span></div><span>›</span></div>`).join(''):'<div class="empty">No notes yet.<br>Make a little room for a new thought.</div>';el.querySelectorAll('.note-item').forEach(x=>x.onclick=()=>openNote(notes.find(n=>n.id===x.dataset.id)))}
function openNote(n){selected=n;$('editor').classList.add('show');$('editorLabel').textContent='Editing note';$('title').value=n.title;$('body').value=n.body;$('editorNotice').textContent='';renderNotes()}
function newNote(){selected=null;$('editor').classList.add('show');$('editorLabel').textContent='New note';$('title').value='';$('body').value='';$('editorNotice').textContent='';renderNotes();$('title').focus()}
$('newButton').onclick=newNote;$('saveButton').onclick=async()=>{let title=$('title').value,body=$('body').value;if(!title.trim()){ $('editorNotice').textContent='Give your note a title.';return}try{let d=await api(selected?'/api/notes/'+selected.id:'/api/notes',{method:selected?'PUT':'POST',body:JSON.stringify({title,body})});selected=d;await loadNotes();openNote(d);$('editorNotice').textContent='Saved.'}catch(e){$('editorNotice').textContent=e.message}};
$('deleteButton').onclick=async()=>{if(!selected||!confirm('Delete this note?'))return;try{await api('/api/notes/'+selected.id,{method:'DELETE'});selected=null;await loadNotes()}catch(e){$('editorNotice').textContent=e.message}};
$('shareButton').onclick=async()=>{if(!selected){$('editorNotice').textContent='Save the note before sharing it.';return}try{let d=await api('/api/notes/'+selected.id+'/share',{method:'POST'}),link=location.origin+'/shared/'+d.share_token;navigator.clipboard?.writeText(link);$('editorNotice').textContent='Share link copied: '+link}catch(e){$('editorNotice').textContent=e.message}};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function logout(){localStorage.removeItem('noteshare_token');location.reload()}
if(location.pathname.startsWith('/shared/'))showShared();else if(token)showApp();
</script></body></html>
