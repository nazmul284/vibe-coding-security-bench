<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoteShare - View Note</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .view-container {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }

    .view-header {
      margin-bottom: 30px;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 20px;
    }

    .view-header h1 {
      color: #333;
      margin-bottom: 10px;
    }

    .view-date {
      color: #999;
      font-size: 14px;
    }

    .view-body {
      line-height: 1.6;
      color: #555;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 16px;
    }

    .error-message {
      background: #ffe0e0;
      color: #d32f2f;
      padding: 20px;
      border-radius: 6px;
      text-align: center;
    }

    .loading {
      text-align: center;
      color: #999;
      padding: 40px;
    }
  </style>
</head>
<body>
  <div class="view-container" id="viewContainer">
    <div class="loading">Loading note...</div>
  </div>

  <script>
    async function loadSharedNote() {
      const params = new URLSearchParams(window.location.search);
      const shareToken = params.get('share');

      if (!shareToken) {
        document.getElementById('viewContainer').innerHTML = '<div class="error-message">Share token not found</div>';
        return;
      }

      try {
        const response = await fetch(`/api/shared/${shareToken}`);

        if (response.status === 200) {
          const note = await response.json();
          document.title = `NoteShare - ${note.title}`;
          document.getElementById('viewContainer').innerHTML = `
            <div class="view-header">
              <h1>${escapeHtml(note.title)}</h1>
              <div class="view-date">Created ${new Date(note.created_at).toLocaleDateString()}</div>
            </div>
            <div class="view-body">${escapeHtml(note.body)}</div>
          `;
        } else if (response.status === 404) {
          document.getElementById('viewContainer').innerHTML = '<div class="error-message">Note not found or share link has expired</div>';
        } else {
          document.getElementById('viewContainer').innerHTML = '<div class="error-message">Error loading note</div>';
        }
      } catch (err) {
        document.getElementById('viewContainer').innerHTML = '<div class="error-message">Error loading note</div>';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    loadSharedNote();
  </script>
</body>
</html>
