<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NoteShare</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1080px;margin:auto;padding:28px 20px}.brand{font-size:22px;font-weight:800;color:#3157d5}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.card{background:white;border:1px solid #e1e7f0;border-radius:16px;padding:24px;box-shadow:0 8px 30px #22304d0b}.auth{max-width:420px;margin:9vh auto}.muted{color:#667085}.hidden{display:none!important}.grid{display:grid;grid-template-columns:310px 1fr;gap:20px}label{font-size:14px;font-weight:700;display:block;margin:15px 0 6px}input,textarea{font:inherit;width:100%;border:1px solid #cdd6e5;border-radius:9px;padding:11px;background:#fff}textarea{min-height:260px;resize:vertical}button{font:inherit;border:0;border-radius:9px;padding:10px 15px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#eaf0ff;color:#3157d5}button.danger{background:#fff0f0;color:#bc2d2d}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.note-item{display:block;width:100%;text-align:left;background:#f8faff;color:#172033;border:1px solid #e3eaf5;margin:8px 0}.note-item.active{border-color:#3157d5;background:#eef2ff}.note-item small{display:block;color:#7a8497;margin-top:4px}.msg{padding:10px;border-radius:8px;margin:12px 0;background:#fff3d6;color:#7b5500}.share{word-break:break-all;background:#eef8f1;color:#27633b;padding:12px;border-radius:8px;margin-top:14px}.empty{text-align:center;padding:32px;color:#667085}@media(max-width:750px){.grid{grid-template-columns:1fr}.top{margin-bottom:20px}}
  </style>
</head>
<body><main class="shell">
  <div class="top"><div class="brand">✦ NoteShare</div><button id="logout" class="secondary hidden">Log out</button></div>
  <section id="auth" class="card auth"><h1>Keep your thoughts close.</h1><p class="muted">Private notes, with sharing when you choose.</p><div id="authMsg" class="msg hidden"></div>
    <form id="authForm"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" minlength="12" autocomplete="current-password" required><div class="actions"><button id="authSubmit">Log in</button><button type="button" id="toggleAuth" class="secondary">Create account</button></div></form>
  </section>
  <section id="app" class="hidden"><div class="grid"><aside class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Your notes</h2><button id="newNote" class="secondary">New</button></div><div id="notes"></div></aside><article class="card"><div id="editor"><div class="empty">Choose a note or create a new one.</div></div></article></div></section>
</main><script>
const $=id=>document.getElementById(id); let token=sessionStorage.getItem('noteshare_token'), notes=[], current=null, signup=false;
function msg(text){$('authMsg').textContent=text;$('authMsg').classList.remove('hidden')}
async function api(path,opts={}){opts.headers={...(opts.headers||{}),'Content-Type':'application/json'};if(token)opts.headers.Authorization='Bearer '+token;const r=await fetch(path,opts);let d=null;try{d=await r.json()}catch{}if(!r.ok)throw Error(d?.error||'Something went wrong');return d}
function showLoggedIn(){ $('auth').classList.toggle('hidden',!!token);$('app').classList.toggle('hidden',!token);$('logout').classList.toggle('hidden',!token);if(token)loadNotes() }
async function loadNotes(){try{notes=await api('/api/notes');renderList()}catch(e){if(e.message==='Authentication required')logout();else alert(e.message)}}
function renderList(){const el=$('notes');el.innerHTML='';if(!notes.length){el.innerHTML='<div class="empty">No notes yet.</div>';return}notes.forEach(n=>{const b=document.createElement('button');b.className='note-item'+(current?.id===n.id?' active':'');b.innerHTML='<strong></strong><small></small>';b.querySelector('strong').textContent=n.title;b.querySelector('small').textContent=new Date(n.updated_at+'Z').toLocaleString();b.onclick=()=>openNote(n);el.appendChild(b)})}
function openNote(n){current=n;renderList();renderEditor()}
function renderEditor(){if(!current){$('editor').innerHTML='<div class="empty">Choose a note or create a new one.</div>';return}$('editor').innerHTML='<label for="title">Title</label><input id="title" maxlength="300"><label for="body">Note</label><textarea id="body" maxlength="100000"></textarea><div class="actions"><button id="save">Save note</button><button id="share" class="secondary">Create share link</button><button id="del" class="danger">Delete</button></div><div id="shareBox"></div>';$('title').value=current.title;$('body').value=current.body;$('save').onclick=save;$('del').onclick=del;$('share').onclick=share}
async function save(){try{const n=await api('/api/notes/'+current.id,{method:'PUT',body:JSON.stringify({title:$('title').value,body:$('body').value})});current=n;notes=notes.map(x=>x.id===n.id?n:x);renderList();renderEditor()}catch(e){alert(e.message)}}
async function del(){if(!confirm('Delete this note?'))return;try{await api('/api/notes/'+current.id,{method:'DELETE'});notes=notes.filter(x=>x.id!==current.id);current=null;renderList();renderEditor()}catch(e){alert(e.message)}}
async function share(){try{const d=await api('/api/notes/'+current.id+'/share',{method:'POST',body:'{}'});$('shareBox').innerHTML='<div class="share">Share link:<br><a target="_blank" rel="noopener" href="/shared/'+encodeURIComponent(d.share_token)+'">'+location.origin+'/shared/'+d.share_token+'</a></div>'}catch(e){alert(e.message)}}
$('authForm').onsubmit=async e=>{e.preventDefault();try{const path=signup?'/api/signup':'/api/login';const d=await api(path,{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});if(signup){signup=false;$('authSubmit').textContent='Log in';$('toggleAuth').textContent='Create account';msg('Account created. You can log in now.')}else{token=d.token;sessionStorage.setItem('noteshare_token',token);showLoggedIn()}}catch(e){msg(e.message)}};
$('toggleAuth').onclick=()=>{signup=!signup;$('authSubmit').textContent=signup?'Create account':'Log in';$('toggleAuth').textContent=signup?'Back to log in':'Create account';$('password').autocomplete=signup?'new-password':'current-password';$('authMsg').classList.add('hidden')};$('logout').onclick=()=>logout();$('newNote').onclick=async()=>{try{const n=await api('/api/notes',{method:'POST',body:JSON.stringify({title:'Untitled note',body:''})});notes.unshift(n);openNote(n)}catch(e){alert(e.message)}};function logout(){token=null;sessionStorage.removeItem('noteshare_token');current=null;showLoggedIn()}showLoggedIn();
</script></body></html>
