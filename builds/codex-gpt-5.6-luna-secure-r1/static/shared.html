<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared note · NoteShare</title><style>body{font-family:system-ui,sans-serif;background:#f4f7fb;color:#172033;margin:0}.wrap{max-width:720px;margin:8vh auto;padding:20px}.card{background:#fff;border:1px solid #e1e7f0;border-radius:16px;padding:28px;box-shadow:0 8px 30px #22304d0b}h1{margin-top:0;white-space:pre-wrap;overflow-wrap:anywhere}.body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.muted{color:#667085}</style></head><body><main class="wrap"><div class="card" id="note"><p class="muted">Loading shared note…</p></div></main><script>const el=document.getElementById('note');const token=location.pathname.split('/').pop();fetch('/api/shared/'+encodeURIComponent(token)).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'This link is unavailable');el.replaceChildren();const h=document.createElement('h1');h.textContent=d.title;const p=document.createElement('div');p.className='body';p.textContent=d.body;const small=document.createElement('p');small.className='muted';small.textContent='Shared with NoteShare';el.append(h,p,small)}).catch(e=>{el.innerHTML='';const h=document.createElement('h1');h.textContent='Link unavailable';const p=document.createElement('p');p.className='muted';p.textContent=e.message;el.append(h,p)});</script></body></html>
